<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="new-chat" id="newChatBtn" aria-label="New chat">
          <span class="plus">+</span><span>New chat</span>
        </button>
        <button class="collapse-btn" id="collapseBtn" aria-label="Collapse sidebar">‹</button>
      </div>

      <div class="history" id="history"></div>

      <div class="sidebar-bottom">
        <button class="side-item"><span>⚙</span><span>Settings</span></button>
        <button class="side-item"><span>?</span><span>Help</span></button>
        <div class="profile">
          <div class="avatar">U</div>
          <div class="profile-text"><strong>User</strong><small>Free plan</small></div>
          <span class="dots">•••</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <button class="model-picker">AI Chat <span>⌄</span></button>
        <button class="top-action" id="themeBtn" aria-label="Toggle theme">☼</button>
      </header>

      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <div class="logo-mark">✦</div>
          <h1>How can I help you today?</h1>
          <p>Ask a question, brainstorm an idea, or get help with a task.</p>
        </div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Message AI Chat..." autocomplete="off"></textarea>
          <div class="composer-bottom">
            <div class="composer-tools">
              <button type="button" class="tool-btn" title="Attach">＋</button>
              <button type="button" class="tool-btn tool-label">Tools <span>⌄</span></button>
            </div>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">↑</button>
          </div>
        </form>
        <div class="disclaimer">AI can make mistakes. Check important information.</div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
